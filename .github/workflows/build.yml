name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libxkbcommon-x11-dev libx11-dev libxi-dev \
            libxcursor-dev libxrandr-dev libwayland-dev libgl1-mesa-dev \
            libegl1-mesa-dev libudev-dev pkg-config
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --locked

  linux:
    name: Linux packages
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libxkbcommon-x11-dev libx11-dev libxi-dev \
            libxcursor-dev libxrandr-dev libwayland-dev libgl1-mesa-dev \
            libegl1-mesa-dev libudev-dev pkg-config dpkg-dev file
      - run: chmod +x scripts/*.sh
      - run: ./scripts/build-linux-packages.sh
      - uses: actions/upload-artifact@v4
        with:
          name: nuvia-linux
          if-no-files-found: error
          path: |
            dist/nuvia_*_amd64.deb
            dist/nuvia-*-x86_64.AppImage

  windows:
    name: Windows packages
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
      - uses: Swatinem/rust-cache@v2
      - name: Install cross compiler and NSIS
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            mingw-w64 nsis zip unzip curl
      - run: chmod +x scripts/*.sh
      - run: ./scripts/build-windows-package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: nuvia-windows
          if-no-files-found: error
          path: |
            dist/nuvia-setup-x86_64.exe
            dist/nuvia-windows-x86_64.zip

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, linux, windows]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
