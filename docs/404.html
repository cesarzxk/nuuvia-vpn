<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Page not found — Nuuvia</title>
  <meta name="theme-color" content="#070a10">
  <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml">
  <style>
    :root { color-scheme: dark; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      color: #e4ecf6;
      background: radial-gradient(700px 500px at 80% 0%, rgba(0,245,160,.1), transparent 70%), #070a10;
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      text-align: center;
    }
    main { max-width: 560px; }
    .tag {
      color: #00f5a0;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .16em;
      text-transform: uppercase;
    }
    h1 { margin: 12px 0; font-size: clamp(40px, 10vw, 72px); line-height: 1; }
    p { color: #7c8fa6; line-height: 1.6; }
    a {
      display: inline-block;
      margin-top: 18px;
      padding: 12px 22px;
      border-radius: 10px;
      color: #03130e;
      background: #00f5a0;
      font-weight: 700;
      text-decoration: none;
    }
    a:hover { background: #58ffc4; }
  </style>
</head>
<body>
  <main>
    <div class="tag">404</div>
    <h1>Wrong turn.</h1>
    <p>This page does not exist. The LAN party is still on the home page.</p>
